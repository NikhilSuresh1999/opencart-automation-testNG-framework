name: OpenCart TestNG Automated Regression Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser engine to execute tests against"
        required: true
        default: "chrome"
        type: choice
        options:
          - chrome
          - firefox
          - edge
      headless:
        description: "Run tests in headless mode"
        required: true
        default: true
        type: boolean
      test:
        description: "Specific Test Class to run (e.g., CheckoutTest, or leave blank for full suite)"
        required: false
        default: ""
        type: string

jobs:
  regression-test:
    name: Execute OpenCart TestNG Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify Environment & Chrome
        run: |
          java -version
          mvn -version
          google-chrome --version || echo "Google Chrome pre-installed on runner"

      - name: Run TestNG Regression Suite
        run: |
          BROWSER="${{ inputs.browser || 'chrome' }}"
          HEADLESS="${{ inputs.headless != '' && inputs.headless || 'true' }}"
          SPECIFIC_TEST="${{ inputs.test }}"

          CMD="mvn clean test -Dbrowser=${BROWSER} -Dheadless=${HEADLESS}"

          if [ -n "$SPECIFIC_TEST" ]; then
            echo "Executing specific test: ${SPECIFIC_TEST}"
            CMD="${CMD} -Dtest=${SPECIFIC_TEST}"
          else
            echo "Executing complete TestNG suite via testng.xml"
          fi

          echo "Running command: ${CMD}"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" eval $CMD

      - name: Upload ExtentReports Interactive HTML Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExtentReports-TestNG-Dashboard
          path: test-output/ExtentReport/
          retention-days: 30

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Surefire-TestNG-Reports
          path: target/surefire-reports/
          retention-days: 30

